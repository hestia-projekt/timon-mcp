name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, linux, x64, ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Node.js 22
        run: |
          node --version
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (!(major >= 22)) { console.error("Node.js 22 or newer is required, got " + process.version); process.exit(1); }'
      - run: npm ci
      - run: npm test
